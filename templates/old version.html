<script>

async function loadSources() {
    try {
        let response = await fetch("/voices"); // this should return a list of source model names
        let sources = await response.json();

        const sourceSelect = document.getElementById("sorce");
        sourceSelect.innerHTML = "";

        sources.forEach(src => {
            const option = document.createElement("option");
            option.value = src;
            option.textContent = src;
            sourceSelect.appendChild(option);
        });

        // auto-load voices for the first source
        if (sources.length > 0) {
            loadVoicesForSource(sources[0]);
        }

        // update voices whenever the source changes
        sourceSelect.addEventListener("change", (e) => {
            loadVoicesForSource(e.target.value);
        });

    } catch (err) {
        console.error("Error loading sources:", err);
    }
}

async function loadVoicesForSource(source) {
    try {
        let response = await fetch(`/GetSpeakerIds/${source}`, { method: "POST" });
        let data = await response.json();

        if (data.error) {
            console.error("Error:", data.error);
            return;
        }

        const voiceSelect = document.getElementById("voice");
        voiceSelect.innerHTML = "";

        data.voices.forEach(v => {
            const option = document.createElement("option");
            option.value = v.id;       // backend can use ID
            option.textContent = v.name; // user sees name
            voiceSelect.appendChild(option);
        });
    } catch (err) {
        console.error("Error loading voices for source:", err);
    }
}


// run at startup
document.addEventListener("DOMContentLoaded", loadSources);
document.getElementById("voice_refresh").addEventListener("click", loadSources)
  
</script>
<script>
async function synthesize() {
    const source = document.getElementById("sorce").value;
    const speaker = document.getElementById("voice").value;
    const text = document.getElementById("text").value.trim();

    if (!text) {
        alert("Please enter some text!");
        return;
    }

    const player = document.getElementById("player1");
    const loading = document.getElementById("player_loading");

    loading.style.display = "inline";
    player.style.display = "none";

    try {
        // Step 1: submit TTS job
        let response = await fetch("/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            //arpabet_conv gate_tresh maxdecode
            body: JSON.stringify({
            voice: source,
            speaker: parseInt(speaker),
            text: text,
            superress: 4,
            arpaconv: true,
            gate_tresh: 0.25,
            maxdecode: 3000
            })
        });
        let job = await response.json();

        if (!job.job_id) {
            throw new Error("Failed to start job: " + JSON.stringify(job));
        }

        const jobId = job.job_id;

        // Step 2: poll status until done
        let status = "pending";
        while (status !== "done") {
            await new Promise(r => setTimeout(r, 1000)); // wait 1s
            let st = await fetch(`/status/${jobId}`);
            let data = await st.json();
            status = data.status;
            if (status === "error") {
                throw new Error("Synthesis failed.");
            }
        }

        // Step 3: fetch audio and play
        const audioUrl = `/download/${jobId}`;
        player.src = audioUrl;
        player.style.display = "block";
        player.play();

    } catch (err) {
        console.error("Error during synthesis:", err);
        alert("Error during synthesis. Check console.");
    } finally {
        loading.style.display = "none";
    }
}

// Hook up button
document.addEventListener("DOMContentLoaded", () => {
    loadSources();
    document.getElementById("generate").addEventListener("click", synthesize);
});
</script>
